name: Verify public research
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Test portable interfaces and verify frozen data
        env:
          PYTHONPATH: src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q
          python -m c10share.verify
          python -m mypy --strict src scripts
          python -m ruff check src scripts tests
      - name: Independently recalculate published tables
        env:
          PYTHONPATH: src
        run: python scripts/build_report.py
